<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc"><title id="title">重播：international 1-start</title><desc id="desc">右手手背面向觀看者，拇指彎曲收在食指根下方，保留完整指尖、指節與基部輪廓，中指、無名指與小指彎曲，只伸出食指順時針畫圈。固定掌部與手腕。起始姿態，待研究者確認。</desc><g id="start" stroke="#111111" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M 147,269 L 145,238 C 130,229 116,217 107,202 C 100,192 96,182 99,172 C 101,165 108,160 115,160 C 123,155 130,151 135,146 L 131,116 L 132,91 C 132,83 136,77 143,77 C 150,77 153,83 153,91 L 155,116 L 160,147 C 162,139 168,139 172,144 C 179,138 188,141 194,148 C 201,146 210,151 213,157 L 226,190 C 230,204 226,219 221,234 L 219,269"/><path d="M 160,147 L 165,164"/><path d="M 172,144 L 179,164"/><path d="M 194,148 L 200,167"/><path d="M 106,163 C 114,160 122,166 127,174 L 139,193 C 146,205 155,211 164,210"/></g></svg>
