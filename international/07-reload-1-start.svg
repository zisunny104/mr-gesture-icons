<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320"><title>重播：食指畫圈</title><desc>第一人稱觀看自己的右手，手背朝自己。右手斜向伸出食指，手背面向觀看者；拇指完整彎曲收於食指根下，其餘三指收合。只有食指畫圈。</desc><g transform="translate(320 0) scale(-1 1)"><g fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(40.000 67.500) scale(0.75)"><g transform="translate(320 0) scale(-1 1)"><path d="M 174,281 L 168,247 C 159,249 138,245 115,225 C 97,217 82,197 87,180 C 90,166 111,156 135,159 L 120,136 L 81,77 C 76,69 77,61 83,58 C 90,55 96,60 100,67 L 123,100 L 155,126 C 166,116 182,118 190,133 C 198,122 214,123 224,140 C 248,150 260,180 267,216 L 255,281" vector-effect="non-scaling-stroke" /><path d="M 93,173 C 103,166 114,177 122,188 L 142,209 C 149,219 160,224 173,223" vector-effect="non-scaling-stroke" /><path d="M 155,126 L 165,144" vector-effect="non-scaling-stroke" /><path d="M 190,133 L 199,150" vector-effect="non-scaling-stroke" /><path d="M 224,140 L 232,158" vector-effect="non-scaling-stroke" /></g></g></g></g></svg>